<script>
(() => {
'use strict';

/* =====================================================================
   0. CONSTANTS, DETERMINISTIC RANDOMNESS, NOISE
   ===================================================================== */
const INK = '#2200FF', PAPER = '#FFFFFF';
const WORLD_SEED = 1028;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function hash3(x, y, z) {

const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* =====================================================================
   1. DITHER PATTERNS (ordered Bayer + material-specific thresholds)
   ===================================================================== */
const BAYER = (() => {

  for (let n = 1; n < 8; n *= 2) {
    const r = [];
    for (let y = 0; y < n * 2; y++) {

})();
const bay = (x, y) => BAYER[((y & 7) << 3) | (x & 7)];

// Light: from the front-left, elevated. In grid space (i,j) the horizontal

const LI = -0.41, LJ = 0.91, LZ = 0.62, SUN_TAN = 0.8;

/* =====================================================================
   2. PROCEDURAL ISLAND GEOMETRY (footprint, terrain, underside)
   ===================================================================== */
const MAT = { GRASS: 1, ROCK: 2, SAND: 3, PATH: 4, WATER: 5, STONE: 6, DOME: 7, PAVE: 8, HEDGE: 9, SLIT: 10, FLOOR: 11 };

function terrace(e, step) { const q = e / step, f = q - Math.floor(q); return (Math.floor(q) + smooth(0.8, 1, f)) * step; }

function* buildFootprint(spec, r) {

}

const ARCH = {

  forest:      { amp: 9,  step: 6,  top: MAT.FLOOR },
  rocky:       { amp: 15, step: 4,  top: MAT.ROCK, ridged: true },
  ruins:       { amp: 6,  step: 8,  top: MAT.GRASS },
  garden:      { amp: 3,  step: 9,  top: MAT.GRASS },
  lake:        { amp: 4,  step: 9,  top: MAT.GRASS },
  desert:      { amp: 4,  step: 99, top: MAT.SAND },
  observatory: { amp: 5,  step: 8,  top: MAT.GRASS },
  plateau:     { amp: 5,  step: 7,  top: MAT.GRASS },

function buildUnderside(T) {

  const roll = r();

    const c = pick(3); if (c < 0) continue;

    const c = j * N + i; if (!mask[c]) continue;

      b = tb + Math.pow(dd, 0.7) * kB * 0.42;

/* =====================================================================
   3. ENVIRONMENTAL FEATURE GENERATION (archetypes, structures, props)
   ===================================================================== */

  }
}
function areaScale(T) { let n = 0; for (let c = 0; c < T.N * T.N; c++) n += T.mask[c]; return n; }

function addWall(T, ci, cj, axis, len, hgt, thick = 2) {
  const s = T.s, r = T.r;
  for (let t = 0; t < len; t++) {
    const prof = hgt * (0.35 + 0.65 * vnoise(t * 0.22, ci, s + 3)) * (vnoise(t * 0.35, cj, s + 4) < 0.22 ? 0.25 : 1);
    for (let w = 0; w < thick; w++) {
      const i = axis ? ci + t : ci + w, j = axis ? cj + w : cj + t;
      const c = idx(T, i, j); if (c < 0 || !T.mask[c] || T.D[c] < 2) continue;
      T.H[c] += Math.max(2, Math.round(prof + (r() < 0.2 ? -2 : 0)));
      T.SOL[c] = 1; T.M[c] = MAT.STONE;
    }
  }
}
function addColumn(T, ci, cj, rad, hgt) {
  for (let j = Math.floor(cj - rad - 1); j <= cj + rad + 1; j++) for (let i = Math.floor(ci - rad - 1); i <= ci + rad + 1; i++) {
    const c = idx(T, i, j); if (c < 0 || !T.mask[c]) continue;
    const d = Math.hypot(i - ci, j - cj); if (d > rad) continue;
    T.H[c] += hgt + (d < rad * 0.5 ? 0.4 : 0); T.SOL[c] = 1; T.M[c] = MAT.STONE;
  }
}

function decorate(T) {
  const { r, spec } = T, arch = spec.arch, N = T.N;
  const area = areaScale(T);
  const per = (k) => Math.max(0, Math.round(area / k));
  const treeSz = () => 4 + r() * (spec.size === 'L' ? 5.5 : spec.size === 'M' ? 4.5 : 3);
  const notPath = (q) => T.M[q] !== MAT.PATH && T.M[q] !== MAT.PAVE;

  if (arch === 'plateau') {
    const s = T.s, mh = 14 + r() * 12, thr = 0.3 + r() * 0.12;
    for (let c = 0; c < N * N; c++) if (T.mask[c]) {
      const i = c % N, j = (c / N) | 0;
      const m = T.D[c] / T.Dmax + (fbm(i * 0.05, j * 0.05, s + 61, 3) - 0.5) * 0.5;
      if (m > thr) T.H[c] += mh + (m > thr + 0.25 ? 6 : 0);
      else if (m > thr - 0.06) T.H[c] += 2;
    }
  }
  if (arch === 'rocky') {
    for (let c = 0; c < N * N; c++) if (T.mask[c] && (T.NZ[c] < 0.42 && T.D[c] > 3)) T.M[c] = MAT.GRASS;
    const pins = 2 + (r() * 3 | 0);
    for (let k = 0; k < pins; k++) {
      const c = randCell(T, (q) => T.D[q] > 5); if (c < 0) continue;
      const ci = c % N, cj = (c / N) | 0, rad = 3 + r() * (T.R * 0.12), ph = 12 + r() * 20;
      for (let j = Math.floor(cj - rad); j <= cj + rad; j++) for (let i = Math.floor(ci - rad); i <= ci + rad; i++) {
        const q = idx(T, i, j); if (q < 0 || !T.mask[q]) continue;
        const d = Math.hypot(i - ci, j - cj) / (rad * (0.8 + 0.4 * vnoise(i * 0.4, j * 0.4, T.s + k)));
        if (d < 1) { T.H[q] = Math.max(T.H[q], T.H[c] + Math.round(ph * Math.pow(1 - d, 0.9) / 3) * 3); T.M[q] = MAT.ROCK; T.SOL[q] = d < 0.85 ? 1 : 0; }
      }
    }
    addCracks(T, [MAT.ROCK], per(60));
    scatter(T, 'rock', per(140) + 2, { minD: 2, sz: () => 2 + r() * 3.5, spacing: 3 });
    scatter(T, 'tuft', per(210), { minD: 2, pred: (q) => T.M[q] === MAT.GRASS });
    if (r() < 0.6) scatter(T, r() < 0.5 ? 'conifer' : 'dead', 1, { minD: 4, sz: treeSz });
  }
  if (arch === 'desert') {
    const mesas = 1 + (r() * 3 | 0);
    for (let k = 0; k < mesas; k++) {
      const c = randCell(T, (q) => T.D[q] > 4); if (c < 0) continue;
      const ci = c % N, cj = (c / N) | 0, rad = 2.5 + r() * (T.R * 0.13), mh = Math.round(6 + r() * 12);
      for (let j = Math.floor(cj - rad * 1.5); j <= cj + rad * 1.5; j++) for (let i = Math.floor(ci - rad * 1.5); i <= ci + rad * 1.5; i++) {
        const q = idx(T, i, j); if (q < 0 || !T.mask[q]) continue;
        const d = Math.hypot(i - ci, j - cj) / (rad * (0.75 + 0.5 * vnoise(i * 0.3, j * 0.3, T.s + 40 + k)));
        if (d < 1) { T.H[q] = T.H[c] + mh - (d > 0.75 ? 3 : 0); T.M[q] = MAT.ROCK; T.SOL[q] = 1; }
        else if (d < 1.35) T.M[q] = MAT.ROCK;
      }
    }
    addCracks(T, [MAT.ROCK], 3);
    scatter(T, 'cactus', 2 + (r() * 4 | 0), { minD: 3, sz: () => 4 + r() * 4, spacing: 5 });
    if (r() < 0.7) scatter(T, 'dead', 1, { minD: 4, sz: treeSz });
    scatter(T, 'rock', per(220) + 1, { minD: 2, sz: () => 1.5 + r() * 3, spacing: 3 });
    scatter(T, 'pebble', per(75), { minD: 2 });
  }
  if (arch === 'lake') {
    const c0 = farthestCell(T, 0.2), ci = c0 % N, cj = (c0 / N) | 0;
    const Rb = clamp(T.D[c0] * 0.62, 3, 30), hW = T.hBase + 0.4;
    for (let c = 0; c < N * N; c++) if (T.mask[c]) {
      const i = c % N, j = (c / N) | 0;
      const d = Math.hypot(i - ci, j - cj) / (Rb * (0.8 + 0.45 * fbm(i * 0.08, j * 0.08, T.s + 88, 3)));
      if (d < 1 && T.D[c] > 3) { T.H[c] = hW; T.M[c] = MAT.WATER; }
      else if (d < 1.5) T.H[c] = Math.min(T.H[c], hW + 1 + (d - 1) * 8);
    }
    for (let c = 0; c < N * N; c++) if (T.M[c] === MAT.WATER && T.r() < 0.08) {
      const i = c % N, j = (c / N) | 0;
      let shore = false;
      for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const q = idx(T, i + a * 2, j + b * 2); if (q >= 0 && T.M[q] !== MAT.WATER) shore = true; }
      if (shore) T.props.push({ type: 'reed', i, j, sz: 2 + T.r() * 3, seed: (T.r() * 1e9) | 0 });
    }
    scatter(T, r() < 0.5 ? 'tree' : 'cypress', 2 + (r() * 3 | 0), { minD: 3, sz: treeSz, spacing: 6 });
    scatter(T, 'bush', 1 + (r() * 3 | 0), { minD: 3, sz: () => 2 + r() * 2 });
    scatter(T, 'rock', 2 + (r() * 3 | 0), { minD: 2, sz: () => 1.5 + r() * 2.5 });
    scatter(T, 'tuft', per(210), { minD: 2 });
    scatter(T, 'flower', per(225), { minD: 2 });
  }
  if (arch === 'ruins') {
    const c0 = farthestCell(T, 0.2), ci = c0 % N, cj = (c0 / N) | 0;
    const ext = clamp(T.D[c0] * 0.85, 6, 20), base = T.H[c0];
    flatten(T, ci, cj, ext + 6, base);
    const hw = Math.round(ext * 0.72), hd = Math.round(ext * 0.5);
    const i0 = ci - hw, i1 = ci + hw, j0 = cj - hd, j1 = cj + hd;
    // paved floor inside the enclosure, tiles missing toward the edges
    for (let j = j0; j <= j1 + 3; j++) for (let i = i0; i <= i1; i++) {
      const c = idx(T, i, j); if (c < 0 || !T.mask[c] || T.D[c] < 2.5) continue;
      const edge = Math.max(Math.abs(i - ci) / hw, Math.abs(j - cj) / hd);
      if (hash3(Math.floor((i + 100) / 4), Math.floor((j + 100) / 4), T.s) > 0.15 + 0.55 * edge) T.M[c] = MAT.PAVE;
    }
    addWall(T, i0, j0, 1, 2 * hw + 1, 13 + r() * 7, 3);       // back wall
    addWall(T, i0, j0, 0, 2 * hd + 2, 9 + r() * 6, 3);        // left wall
    addWall(T, i1 - 2, j0 + hd, 0, hd + 2, 6 + r() * 4, 3);   // right fragment
    addWall(T, i0 + 3, j1 + 1, 1, Math.round(hw * 0.7), 3, 2); // low rubble line
    // broken round tower on the back-right corner
    const ti = i0 + 1, tj = j1 - 1, tr = 4.2 + r() * 1.4, th = 30 + r() * 12;
    for (let j = Math.floor(tj - tr - 1); j <= tj + tr + 1; j++) for (let i = Math.floor(ti - tr - 1); i <= ti + tr + 1; i++) {
      const q = idx(T, i, j); if (q < 0 || !T.mask[q] || T.D[q] < 1.5) continue;
      const d = Math.hypot(i - ti, j - tj); if (d > tr) continue;
      const a = Math.atan2(j - tj, i - ti), top = th * (0.6 + 0.4 * vnoise(a * 1.8 + 9, 0, T.s + 71));
      T.H[q] = base + (d < tr - 1.7 ? top - 8 : top); T.SOL[q] = 1; T.M[q] = MAT.STONE;
    }
    // colonnade in front of the enclosure
    const cjj = j1 + 6, nc = Math.max(3, Math.floor((2 * hw) / 6));
    for (let k = 0; k <= nc; k++) {
      const pi = Math.round(i0 + 1 + k * (2 * hw - 2) / nc), c = idx(T, pi, cjj);
      if (c < 0 || !T.mask[c] || T.D[c] < 3.5) continue;
      if (k === 2) continue; // gap where one fell
      addColumn(T, pi, cjj, 1.9, hash3(k, 1, T.s) < 0.3 ? 4 + r() * 4 : 17 + r() * 10);
    }
    { // the fallen column lies across the grass
      const fi = Math.round(i0 + 1 + 2 * (2 * hw - 2) / nc) - 1, fj = cjj + 2;
      for (let t = 0; t < 11; t++) for (let w = -2; w <= 2; w++) {
        const c = idx(T, fi + t, fj + w);
        if (c < 0 || !T.mask[c] || T.D[c] < 2 || T.SOL[c]) continue;
        T.H[c] = base + Math.sqrt(Math.max(0, 4.6 - w * w)) * 1.3; T.SOL[c] = 1; T.M[c] = MAT.STONE;
      }
    }
    addCracks(T, [MAT.PAVE], 3);
    scatter(T, 'tree', 1 + (r() * 2 | 0), { minD: 3, sz: treeSz, spacing: 6 });
    scatter(T, 'cypress', 2, { minD: 3, sz: treeSz, spacing: 5 });
    scatter(T, 'bush', 3 + (r() * 3 | 0), { minD: 2, sz: () => 1.8 + r() * 2 });
    scatter(T, 'rock', 2, { minD: 2, sz: () => 1.5 + r() * 2 });
    scatter(T, 'tuft', per(220), { minD: 2, pred: notPath });
    scatter(T, 'pebble', per(300), { minD: 2, pred: (q) => T.M[q] === MAT.PAVE });
    scatter(T, 'flower', per(300), { minD: 2, pred: notPath });
  }
  if (arch === 'observatory') {
    const c0 = farthestCell(T, 0.15), ci = c0 % N, cj = (c0 / N) | 0;
    const rd = clamp(T.D[c0] * 0.42, 4, 9), base = T.H[c0];
    flatten(T, ci, cj, rd + 7, base);
    for (let j = Math.floor(cj - rd - 4); j <= cj + rd + 4; j++) for (let i = Math.floor(ci - rd - 4); i <= ci + rd + 4; i++) {
      const c = idx(T, i, j); if (c < 0 || !T.mask[c]) continue;
      const d = Math.hypot(i - ci, j - cj);
      if (d <= rd + 2.6) { T.H[c] = base + 4; T.M[c] = MAT.PAVE; T.SOL[c] = 0; }
      if (d <= rd) {
        T.H[c] = base + 4 + Math.sqrt(rd * rd - d * d) * 1.15 + 3; T.SOL[c] = 1; T.M[c] = MAT.DOME;
        const a = Math.atan2(j - cj, i - ci), slit = Math.abs(((a - 1.9 + 9.42) % 6.283) - 3.14);
        if (slit < 0.24 && d < rd - 0.6) T.M[c] = MAT.SLIT;
      }
    }
    // stairs stepping down toward the viewer (+j), walkable
    for (let k = 0; k < 6; k++) for (let w = -1; w <= 1; w++) {
      const c = idx(T, ci + w, Math.round(cj + rd + 2.6 + k)); if (c < 0 || !T.mask[c]) continue;
      T.H[c] = base + 4 - (k + 1) * 0.75; T.M[c] = MAT.STONE;
    }
    const pathEnd = randCell(T, (q) => T.D[q] > 3 && T.D[q] < 6);
    if (pathEnd >= 0) stampPath(T, [[ci, cj + rd + 9], [(ci + pathEnd % N) / 2 + (r() - 0.5) * 6, (cj + rd + 9 + ((pathEnd / N) | 0)) / 2], [pathEnd % N, (pathEnd / N) | 0]], 1);
    scatter(T, 'cypress', 1 + (r() * 3 | 0), { minD: 3, sz: treeSz, spacing: 5 });
    scatter(T, 'rock', 2 + (r() * 3 | 0), { minD: 2, sz: () => 1.5 + r() * 3 });
    scatter(T, 'tuft', per(210), { minD: 2, pred: notPath });
    scatter(T, 'flower', per(400), { minD: 2, pred: notPath });
  }
  if (arch === 'garden') {
    const c0 = farthestCell(T, 0.2), ci = c0 % N, cj = (c0 / N) | 0, Rr = Math.max(4, T.D[c0] * 0.65);
    const loop = [];
    for (let k = 0; k <= 24; k++) {
      const a = k / 24 * 6.283, rr = Rr * (0.85 + 0.3 * vnoise(k * 0.5, 0, T.s + 2));
      loop.push([ci + Math.cos(a) * rr, cj + Math.sin(a) * rr * 0.9]);
    }
    stampPath(T, loop, 1);
    stampPath(T, [[ci, cj], [ci + Rr, cj + (r() - 0.5) * Rr]], 1);
    if (r() < 0.6 && spec.size !== 'S') { // pond
      const pr = 2.5 + r() * 2.5;
      for (let j = Math.floor(cj - pr - 1); j <= cj + pr + 1; j++) for (let i = Math.floor(ci - pr - 1); i <= ci + pr + 1; i++) {
        const c = idx(T, i, j); if (c < 0 || !T.mask[c]) continue;
        const d = Math.hypot(i - ci, j - cj); if (d < pr) { T.H[c] = T.H[c0] - 1; T.M[c] = MAT.WATER; }
      }
    }
    // hedges: low leafy walls along short segments
    for (let k = 0; k < 2 + (r() * 3 | 0); k++) {
      const c = randCell(T, (q) => T.D[q] > 4 && T.M[q] === MAT.GRASS); if (c < 0) continue;
      const ax = r() < 0.5, len = 5 + (r() * 9 | 0);
      for (let t = 0; t < len; t++) for (let w = 0; w < 2; w++) {
        const q = ax ? idx(T, c % N + t, ((c / N) | 0) + w) : idx(T, c % N + w, ((c / N) | 0) + t);
        if (q < 0 || !T.mask[q] || T.D[q] < 2 || T.M[q] === MAT.PATH || T.M[q] === MAT.WATER) continue;
        T.H[q] += 3 + (vnoise(t * 0.5, w, T.s) > 0.6 ? 1 : 0); T.M[q] = MAT.HEDGE; T.SOL[q] = 1;
      }
    }
    scatter(T, 'bush', per(160) + 2, { minD: 2, sz: () => 1.6 + r() * 2.2, spacing: 3, pred: notPath });
    scatter(T, 'tree', 1, { minD: 4, sz: treeSz });
    scatter(T, 'cypress', r() < 0.5 ? 2 : 0, { minD: 3, sz: treeSz });
    scatter(T, 'flower', per(70), { minD: 2, pred: notPath });
    scatter(T, 'tuft', per(490), { minD: 2, pred: notPath });
  }
  if (arch === 'meadow') {
    scatter(T, r() < 0.7 ? 'tree' : 'cypress', 1 + (r() * 2 | 0), { minD: 4, sz: treeSz, spacing: 8 });
    scatter(T, 'bush', r() * 3 | 0, { minD: 3, sz: () => 2 + r() * 2 });
    scatter(T, 'rock', 1 + (r() * 3 | 0), { minD: 2, sz: () => 1.5 + r() * 2.5 });
    scatter(T, 'flower', per(75), { minD: 2 });
    scatter(T, 'tuft', per(154), { minD: 2 });
    if (spec.size !== 'S' && r() < 0.6) { const c = randCell(T, (q) => T.D[q] > 4); if (c >= 0) stampPath(T, wanderPath(T, c, 14, 1.0), 0); }
  }
  if (arch === 'forest') {
    const n = per(spec.size === 'S' ? 80 : 120) + 3;
    for (let k = 0; k < n; k++) {
      const roll = r(), t = roll < 0.5 ? 'tree' : roll < 0.85 ? 'conifer' : 'cypress';
      scatter(T, t, 1, { minD: 3, sz: treeSz, spacing: 3.2 });
    }
    scatter(T, 'bush', per(200) + 2, { minD: 2, sz: () => 1.6 + r() * 2 });
    scatter(T, 'tuft', per(280), { minD: 2 });
    scatter(T, 'rock', 1 + (r() * 2 | 0), { minD: 2, sz: () => 1.5 + r() * 2 });
    if (spec.size !== 'S') { const c = randCell(T, (q) => T.D[q] > 4); if (c >= 0) stampPath(T, wanderPath(T, c, 16, 1.2), 0); }
  }
  if (arch === 'plateau') {
    scatter(T, 'tree', 1 + (r() * 2 | 0), { minD: 4, sz: treeSz, spacing: 6 });
    scatter(T, 'conifer', 1 + (r() * 3 | 0), { minD: 3, sz: treeSz, spacing: 5 });
    scatter(T, 'rock', 2 + (r() * 3 | 0), { minD: 2, sz: () => 1.5 + r() * 3 });
    scatter(T, 'tuft', per(196), { minD: 2 });
    scatter(T, 'flower', per(300), { minD: 2 });
  }
  if (arch === 'fragment') {
    scatter(T, r() < 0.5 ? 'tree' : 'cypress', 1, { minD: 3, sz: treeSz });
    scatter(T, 'rock', 2 + (r() * 3 | 0), { minD: 1.5, sz: () => 1.5 + r() * 2.5, spacing: 3 });
    scatter(T, 'tuft', per(175), { minD: 1.5 });
    scatter(T, 'flower', per(275), { minD: 2 });
    addCracks(T, [MAT.GRASS], 2);
  }
  // Steep natural slopes read as exposed rock.
  for (let c = N + 1; c < N * N - N - 1; c++) if (T.mask[c] && !T.SOL[c] && T.M[c] === MAT.GRASS) {
    const g = Math.abs(T.H[c + 1] - T.H[c - 1]) + Math.abs(T.H[c + N] - T.H[c - N]);
    if (g > 5 && T.mask[c + 1] && T.mask[c - 1] && T.mask[c + N] && T.mask[c - N]) T.M[c] = MAT.ROCK;
  }
}

/* =====================================================================
   4. ISOMETRIC PROJECTION + 5. DITHERING / PIXEL RENDERING
   Grid cell (i,j) at height h projects to sprite pixel
   x = i - j + ox,  y = floor((i + j) / 2 - h) + oy   (2:1 iso, ~30° view)
   ===================================================================== */
const PAD_T = 50, PAD_S = 12, PAD_B = 28;

function rasterize(T) {
  const { N, mask, H, B } = T;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i; if (!mask[c]) continue;
    const x = i - j, s = (i + j) * 0.5;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    const yt = Math.floor(s - H[c]), yb = Math.floor(s + B[c]);
    if (yt < minY) minY = yt; if (yb > maxY) maxY = yb;
  }
  const W = maxX - minX + 1 + PAD_S * 2, Hh = maxY - minY + 1 + PAD_T + PAD_B;
  const ox = -minX + PAD_S, oy = -minY + PAD_T;
  const cell = new Int32Array(W * Hh).fill(-1), dep = new Int16Array(W * Hh);
  for (let s = 0; s <= 2 * N - 2; s++) {
    for (let i = Math.max(0, s - N + 1); i <= Math.min(N - 1, s); i++) {
      const j = s - i, c = j * N + i; if (!mask[c]) continue;
      const x = i - j + ox, yt = Math.floor(s * 0.5 - H[c]) + oy, yb = Math.floor(s * 0.5 + B[c]) + oy;
      for (let y = yt; y <= yb; y++) { const p = y * W + x; cell[p] = c; dep[p] = y - yt; }
    }
  }
  return { W, Hh, ox, oy, cell, dep };
}

function smoothNormals(T, F, outside) {
  const { N, mask } = T, ni = new Float32Array(N * N), nj = new Float32Array(N * N);
  const g = (i, j) => { const c = idx(T, i, j); return c >= 0 && mask[c] ? F[c] : outside(i, j); };
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i; if (!mask[c]) continue;
    let gi = 0, gj = 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      gi += g(i + di + 1, j + dj) - g(i + di - 1, j + dj);
      gj += g(i + di, j + dj + 1) - g(i + di, j + dj - 1);
    }
    const l = Math.hypot(gi, gj) || 1;
    ni[c] = -gi / l; nj[c] = -gj / l;
  }
  return { ni, nj };
}

function castShadows(T) {
  const { N, mask, H } = T, sh = new Uint8Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i; if (!mask[c]) continue;
    const h0 = H[c];
    for (let k = 1.5; k < 22; k += 1) {
      const q = idx(T, Math.round(i + LI * k), Math.round(j + LJ * k));
      if (q < 0) break;
      if (mask[q] && H[q] > h0 + k * SUN_TAN + 0.8) { sh[c] = 1; break; }
    }
  }
  // soft prop shadows (trees, bushes, rocks) stamped toward the far side
  for (const p of T.props) {
    const ext = { tree: 1.5, conifer: 1.1, cypress: 0.7, bush: 0.9, rock: 0.8, dead: 0.4, cactus: 0.35 }[p.type];
    if (!ext) continue;
    const len = p.sz * (p.type === 'bush' || p.type === 'rock' ? 0.5 : 1.3);

function updateStreams(dt, t) {

// Each line of a stream follows its own path: the trail, smoothed over a window

/* ---- drawing ------------------------------------------------------- */
function drawWords() {
  if (!lex.fontReady || (!words.length && !streams.length)) return;
  const s = cam.scale, left = cam.x - devW / (2 * s), top = cam.y - devH / (2 * s);
  ctx.save();
  ctx.font = `400 ${(fontWorld * s).toFixed(2)}px ${TYPE_FAMILY}`;

function initLanguage() {
  fontWorld = TYPE_PX / (cam.scale / dpr);
  lex.measure = document.createElement('canvas').getContext('2d');
  const ready = () => {
    lex.fontReady = document.fonts ? document.fonts.check(`400 ${TYPE_PX}px "IBM Plex Mono"`) : true;
    lex.measure.font = `400 ${TYPE_PX}px ${TYPE_FAMILY}`;

  lex.measure.font = `400 ${TYPE_PX}px ${TYPE_FAMILY}`;

  setInterval(loadCollection, 3 * 3600e3);

let last = performance.now(), chunkTick = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000; lastNow = t;
  updateCamera(dt, now);
  if (++chunkTick % 8 === 0) updateChunks();
  processQueue(7);
  updateIslands(dt);
  for (const isl of world.islands.values()) if (isl.drag || isl.active) trail(isl, dt);
  updateParticles(dt);
  updateWords(dt, t);
  render(t);
  drawWords();
  requestAnimationFrame(frame);
}

function start() {
  resize();
  cam.scale = cam.target = defaultScale();
  updateChunks();
  // generate the opening composition up front, then dissolve it in
  while (world.queue.length || job) processQueue(1e9);
  const v = viewRect();
  for (const isl of world.islands.values()) {
    isl.fade = 0;
    isl.fadeDelay = 0.15 + Math.hypot(isl.x - cam.x, isl.y - cam.y) / 900;

  requestAnimationFrame((n) => { last = n; frame(n); });
}
addEventListener('resize', () => { const keep = cam.scale / dpr; resize(); cam.scale = cam.target = clamp(Math.round(keep * dpr), zMin, zMax); });
start();
})();
