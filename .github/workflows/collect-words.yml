name: Collect words

# Refreshes words.json from public Bluesky posts once a day, commits it if
# anything changed, then redeploys the site to GitHub Pages.
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-words
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Install
        working-directory: collector
        run: npm ci

      - name: Collect
        working-directory: collector
        env:
          # Optional. Without them the collector uses unauthenticated public endpoints.
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node collect.mjs ../words.json

      - name: Commit words.json
        id: commit
        run: |
          if git diff --quiet -- words.json; then
            echo "words.json unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words.json
          git commit -m "Update words.json"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
